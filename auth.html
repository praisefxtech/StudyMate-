<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyMate - Login</title>

<link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">

<div class="auth-container">

    <img src="icon-192.png" class="auth-logo">

    <h1>StudyMate</h1>

    <p class="auth-subtitle">
        Focus • Plan • Archive
    </p>

<div class="auth-card">

    <!-- LOGIN -->
    <div id="loginForm">

        <h2>Welcome Back 👋</h2>

        <input
        type="email"
        id="loginEmail"
        placeholder="Email">

        <div class="password-box">

<input
type="password"
id="loginPassword"
placeholder="Password">

<button
type="button"
id="showLoginPassword">
👁️
</button>

</div>

        <button id="loginBtn">
            Login
        </button>
<button id="forgotPassword" class="forgot-btn">
    🔑 Forgot Password?
</button>
        <p>
            Don't have an account?
            <a href="#" id="openSignup">
                Create Account
            </a>
        </p>

    </div>


    <!-- SIGN UP -->
    <div id="signupForm" style="display:none;">

        <h2>Create Account 🎓</h2>

        <input
        type="text"
        id="signupName"
        placeholder="Full Name">

        <input
        type="email"
        id="signupEmail"
        placeholder="Email">

<div class="password-box">

<input
type="password"
id="signupPassword"
placeholder="Password">

<button
type="button"
id="showSignupPassword">
👁️
</button>

</div>

        <button id="signupBtn">
            Create Account
        </button>

        <p>
            Already have an account?
            <a href="#" id="openLogin">
                Login
            </a>
        </p>

    </div>

    <p id="authMessage"></p>

</div>

</div>

<script type="module" src="firebase.js"></script>
<script src="auth.js"></script>

</body>

</html>
